version: "3.9"

services:
  voicebot:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: voicebot-ctm:gpu
    container_name: voicebot-ctm-gpu

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      - ENV=production
      - CUDA_VISIBLE_DEVICES=0
      - TRANSFORMERS_OFFLINE=0
      - HF_HUB_OFFLINE=0

    volumes:
      - voicebot-models:/root/.cache
      - voicebot-local-models:/app/models
      - voicebot-data:/app/data
      - voicebot-db:/app/app/database
      - voicebot-logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  voicebot-models:
  voicebot-local-models:
  voicebot-data:
  voicebot-db:
  voicebot-logs: